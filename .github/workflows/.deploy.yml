name: Deploy OpenGol Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Rebuild SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > deploy_key
          chmod 600 deploy_key

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 143.47.44.40 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i deploy_key ubuntu@143.47.44.40 << 'EOF'
            set -e
            cd ~/OpenGol-Backend
            git pull origin main
            docker compose up -d --build
            docker image prune -f
          EOF