name: Deploy OpenGol Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Write SSH key
        shell: bash
        run: |
          cat > deploy_key <<'EOF'
          ${{ secrets.SERVER_SSH_KEY }}
          EOF
          chmod 600 deploy_key
          head -n 1 deploy_key
          ssh-keygen -y -f deploy_key > /dev/null

      - name: Add server to known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on server
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=yes -i deploy_key ubuntu@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd ~/OpenGol-Backend
            git pull origin main
            docker compose up -d --build
            docker image prune -f
          EOF