version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: opengol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
      POSTGRES_DB: opengol
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    container_name: opengol-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data: